name: Deploy flash.osf.bike

# push-only, no pull_request trigger - this only ever runs after a merge to
# master (which itself requires a reviewed PR, branch protection), never on
# an unmerged PR from anyone (fork or not). Deliberate: avoids the "runs on
# any opened PR" surface Cloudflare's own Workers Builds Git integration has
# - see PR #2's discussion for the full reasoning.
on:
  push:
    branches: [master]
    paths:
      - "tools/web_configurator/**"
      - ".github/workflows/deploy-flash.yaml"

concurrency:
  group: deploy-flash-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # actions/checkout doesn't init submodules by default. Same fix as
      # web-configurator.yaml's own step (added there when this submodule
      # was introduced, missed here) - only init the one this build
      # actually touches (uart-transport.ts's dynamic import of the
      # vendored WebUSB-serial shim for Android flashing), not the repo's
      # other, much larger vendored toolchain submodules this job never
      # needs.
      - name: Init webserial-esptool submodule
        working-directory: tools/web_configurator
        run: git submodule update --init vendor/webserial-esptool

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/web_configurator/package-lock.json

      - name: Install dependencies
        working-directory: tools/web_configurator
        run: npm ci

      - name: Build
        working-directory: tools/web_configurator
        run: npm run build

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: tools/web_configurator
          command: deploy
          # Not a devDependency here, so the action falls back to an old
          # pinned default (3.90.0) that doesn't support assets-only Workers
          # (no `main` - see wrangler.jsonc) and fails with "Missing
          # entry-point". Pin to a real current release instead.
          wranglerVersion: "4"
