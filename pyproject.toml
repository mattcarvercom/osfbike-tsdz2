[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tests"]

[project]
name = "TSDZ2-Smart-EBike"
version = "20.1C.6"
description = "TSDZ2 Open Source Firmware adapted to VLCD5-VLCD6-XH18 displays."
requires-python = ">=3.7"

dependencies = [
    "pytest",
    "cffi >=1.15.0",
    "setuptools",
    "numpy",
    "hypothesis",
    # pinned below 3.0: load_c_code.py imports pycparser.plyparser, which
    # pycparser 3.0 removed/renamed - resolving to 3.0 as a transitive cffi
    # dep silently breaks the whole native test harness (tests/conftest.py
    # fails to import) with no indication why
    "pycparser <3.0",
]

[project.urls]
"Homepage" = "https://github.com/emmebrusa/TSDZ2-Smart-EBike-1"

[tool.pyright]
extraPaths = ["tests"]

[tool.pytest.ini_options]
addopts = [
    # "--ignore=tests/example",
]
